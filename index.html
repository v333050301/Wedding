<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vereak & Stephanie's Wedding</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#faf8f5;
    color:#333;
}

.hero{
    height:100vh;
    background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.4)),
    url('https://photos.google.com/photo/AF1QipP2Lu5KkQ7bClLSubpxAyMirV3AbmstNTyOcI6T');
    background-size:cover;
    background-position:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
}

.hero h1{
    font-size:4rem;
    margin-bottom:10px;
}

.hero p{
    font-size:1.3rem;
}

.countdown{
    margin-top:20px;
    font-size:1.5rem;
    font-weight:bold;
}

.section{
    max-width:900px;
    margin:auto;
    padding:60px 20px;
}

.section h2{
    text-align:center;
    margin-bottom:30px;
    color:#8c6b5a;
}

.details{
    text-align:center;
    line-height:2;
}

.rsvp-form{
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}

input, select, textarea{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:14px;
    background:#8c6b5a;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#745647;
}

footer{
    text-align:center;
    padding:30px;
    background:#f2ece6;
    margin-top:40px;
}
</style>
</head>
<body>

<section class="hero">
    <h1>Vereak & Stepanie</h1>
    <p>We're Getting Married!</p>
    <p>June 16, 2028</p>
    <div class="countdown" id="countdown"></div>
</section>

<section class="section">
    <h2>Wedding Details</h2>

    <div class="details">
        <p><strong>Date:</strong> June 16, 2028</p>
        <p><strong>Ceremony:</strong> 3:00 PM</p>
        <p><strong>Venue:</strong> Los Gatos History Museum</p>
        <p><strong>Reception:</strong> 6:00 PM</p>
    </div>
</section>

<section class="section">
    <h2>RSVP</h2>

    <form
    class="rsvp-form"
    action="https://formsubmit.co/v8sking@gmail.com"
    method="POST">

        <input type="hidden" name="_subject" value="Wedding RSVP">
        <input type="hidden" name="_captcha" value="false">

       

        <label>Email</label>
        <input type="email" name="Email" required>

        <label>Will you attend?</label>
        <select name="Attendance" required>
            <option value="">Select</option>
            <option>Yes, I'll be there!</option>
            <option>Sorry, I can't make it</option>
        </select>

        <label>Meal Choice</label>
        <select name="Meal">
            <option>TBD 1</option>
            <option>TBD 2</option>
            <option>TBD 3</option>
        </select>

        <label>Special Requests</label>
        <textarea rows="4" name="Requests"></textarea>

        <button type="submit">Submit RSVP</button>
    </form>
</section>

<footer>
    We can't wait to celebrate our day of love with you - V&S
</footer>

<script>
const weddingDate = new Date("June 16, 2028 15:00:00").getTime();

const timer = setInterval(function () {

    const now = new Date().getTime();
    const distance = weddingDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24))
    / (1000 * 60 * 60));

    document.getElementById("countdown").innerHTML =
        days + " Days " + hours + " Hours";

    if (distance < 0) {
        clearInterval(timer);
        document.getElementById("countdown").innerHTML =
        "Today is the day!";
    }

}, 1000);
</script>

</body>
</html>
